# /etc/nginx/sites-available/bot.wecreate.uz
# Telegram webhook faqat HTTPS talab qiladi (443/88/80/8443 ruxsat).

server {
    listen 80;
    server_name bot.wecreate.uz;
    # Let's Encrypt / Cloudflare orqasida bo'lsa HTTP->HTTPS redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bot.wecreate.uz;

    ssl_certificate     /etc/letsencrypt/live/bot.wecreate.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.wecreate.uz/privkey.pem;

    client_max_body_size 25m;   # video file_id yetarli, lekin ehtiyot uchun

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
